name: ${COMPOSE_PROJECT_NAME:-my-cfo}

services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - path: ${MY_CFO_ENV_FILE}
        required: false
    environment:
      DATABASE_URL: sqlite:////data/my-cfo.db
    volumes:
      - ${MY_CFO_DATA_DIR}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${MY_CFO_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  backup:
    image: alpine:3.20
    profiles: ["backup"]
    env_file:
      - path: ${MY_CFO_ENV_FILE}
        required: false
    volumes:
      - ${MY_CFO_DATA_DIR}:/data
      - ${MY_CFO_BACKUP_DIR}:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup_sqlite.sh"]
